<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980" role="img" aria-labelledby="title desc">
  <title id="title">Mini Redis 자료구조와 동작 흐름</title>
  <desc id="desc">CLI 명령이 CommandProcessor와 MiniRedis를 거쳐 HashMap, LRU 이중 연결 리스트, TTL 최소 힙을 사용하는 구조를 보여주는 다이어그램</desc>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#ea580c"/>
    </marker>
    <style>
      text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
        fill: #0f172a;
      }
      .title { font-size: 30px; font-weight: 750; }
      .subtitle { font-size: 15px; fill: #475569; }
      .section-title { font-size: 20px; font-weight: 700; }
      .box-title { font-size: 16px; font-weight: 700; }
      .label { font-size: 13px; }
      .small { font-size: 12px; fill: #475569; }
      .tiny { font-size: 11px; fill: #475569; }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 12px;
      }
      .panel { fill: #ffffff; stroke-width: 2; }
      .flow { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#arrow); }
      .reference { fill: none; stroke: #2563eb; stroke-width: 2.5; marker-end: url(#arrow-blue); }
      .lru-reference { fill: none; stroke: #ea580c; stroke-width: 2.5; marker-end: url(#arrow-orange); }
    </style>
  </defs>

  <rect width="1200" height="980" rx="24" fill="#f8fafc"/>

  <text x="50" y="43" class="title">Mini Redis 자료구조와 동작 흐름</text>
  <text x="50" y="68" class="subtitle">키 조회는 HashMap, 사용 순서는 LRU, 만료 우선순위는 MinHeap이 담당하고 MiniRedis가 세 구조를 함께 갱신합니다.</text>

  <!-- Command flow -->
  <rect x="55" y="92" width="250" height="78" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="180" y="122" text-anchor="middle" class="box-title">사용자 명령</text>
  <text x="180" y="148" text-anchor="middle" class="mono">SET · GET · DEL · EXPIRE · TTL</text>

  <path d="M305 131 H365" class="flow"/>

  <rect x="370" y="92" width="295" height="78" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="518" y="122" text-anchor="middle" class="box-title">CLI / CommandProcessor</text>
  <text x="518" y="148" text-anchor="middle" class="small">입력 파싱 · 명령 검증 · 출력 변환</text>

  <path d="M665 131 H725" class="flow"/>

  <rect x="730" y="92" width="415" height="78" rx="14" fill="#0f172a" stroke="#0f172a" stroke-width="2"/>
  <text x="938" y="122" text-anchor="middle" class="box-title" fill="#ffffff" style="fill:#ffffff">MiniRedis</text>
  <text x="938" y="148" text-anchor="middle" class="small" fill="#cbd5e1" style="fill:#cbd5e1">데이터 · LRU · TTL · 메모리 상태를 일관되게 관리</text>

  <!-- Fan-out from MiniRedis -->
  <path d="M938 170 V210 H215 V245" class="flow"/>
  <path d="M938 210 H600 V245" class="flow"/>
  <path d="M938 210 H985 V245" class="flow"/>

  <!-- HashMap panel -->
  <rect x="40" y="250" width="350" height="420" rx="18" class="panel" stroke="#0284c7"/>
  <text x="65" y="283" class="section-title">1. HashMap — 키 조회</text>

  <rect x="65" y="302" width="300" height="52" rx="10" fill="#e0f2fe" stroke="#7dd3fc"/>
  <text x="215" y="324" text-anchor="middle" class="box-title">FNV-1a 해시</text>
  <text x="215" y="344" text-anchor="middle" class="mono">hash(key) % capacity → index</text>

  <path d="M215 354 V376" class="flow"/>
  <text x="66" y="396" class="small">버킷 배열</text>
  <g transform="translate(65 407)">
    <rect x="0" y="0" width="48" height="38" fill="#f1f5f9" stroke="#94a3b8"/>
    <rect x="48" y="0" width="48" height="38" fill="#f1f5f9" stroke="#94a3b8"/>
    <rect x="96" y="0" width="48" height="38" fill="#bae6fd" stroke="#0284c7" stroke-width="2"/>
    <rect x="144" y="0" width="48" height="38" fill="#f1f5f9" stroke="#94a3b8"/>
    <rect x="192" y="0" width="48" height="38" fill="#f1f5f9" stroke="#94a3b8"/>
    <rect x="240" y="0" width="60" height="38" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="24" y="25" text-anchor="middle" class="label">0</text>
    <text x="72" y="25" text-anchor="middle" class="label">1</text>
    <text x="120" y="25" text-anchor="middle" class="label">2</text>
    <text x="168" y="25" text-anchor="middle" class="label">3</text>
    <text x="216" y="25" text-anchor="middle" class="label">4</text>
    <text x="270" y="25" text-anchor="middle" class="label">…</text>
  </g>

  <path d="M185 445 V467" class="flow"/>
  <rect x="66" y="472" width="145" height="94" rx="10" fill="#f0f9ff" stroke="#0284c7"/>
  <text x="138" y="494" text-anchor="middle" class="box-title">Bucket Node A</text>
  <text x="78" y="518" class="mono">HashEntry</text>
  <text x="78" y="538" class="mono">key = "user:1"</text>
  <text x="78" y="558" class="mono">value = ref</text>

  <path d="M211 519 H229" class="flow"/>
  <rect x="234" y="472" width="131" height="94" rx="10" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="300" y="494" text-anchor="middle" class="box-title">Bucket Node B</text>
  <text x="247" y="518" class="mono">HashEntry</text>
  <text x="247" y="538" class="mono">key = "user:9"</text>
  <text x="300" y="558" text-anchor="middle" class="tiny">같은 index 충돌</text>

  <text x="65" y="603" class="label">• HashEntry.value가 CacheEntry를 참조</text>
  <text x="65" y="625" class="label">• 로드 팩터 &gt; 0.75이면 버킷을 2배 확장</text>
  <rect x="65" y="640" width="135" height="22" rx="11" fill="#e0f2fe"/>
  <text x="132" y="655" text-anchor="middle" class="tiny">평균 조회 O(1)</text>

  <!-- Shared CacheEntry and LRU panel -->
  <rect x="425" y="250" width="350" height="420" rx="18" class="panel" stroke="#ea580c"/>
  <text x="450" y="283" class="section-title">2. CacheEntry + LRU</text>

  <rect x="455" y="308" width="290" height="176" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="600" y="336" text-anchor="middle" class="box-title">공유 CacheEntry 객체</text>
  <line x1="475" y1="348" x2="725" y2="348" stroke="#a5f3fc"/>
  <text x="480" y="371" class="mono">key         = "user:1"</text>
  <text x="480" y="393" class="mono">value       = "Alice"</text>
  <text x="480" y="415" class="mono">expire_at   = 105s</text>
  <text x="480" y="437" class="mono">ttl_version = 3</text>
  <text x="480" y="459" class="mono">lru_node    = ref</text>

  <!-- HashEntry.value to CacheEntry -->
  <path d="M188 558 C285 596, 390 590, 420 430 H455" class="reference"/>

  <text x="522" y="540" text-anchor="middle" class="tiny">front / MRU</text>
  <text x="716" y="540" text-anchor="middle" class="tiny">back / LRU</text>
  <g transform="translate(446 548)">
    <rect x="0" y="0" width="52" height="46" rx="8" fill="#fff7ed" stroke="#fdba74"/>
    <rect x="68" y="0" width="78" height="46" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
    <rect x="162" y="0" width="78" height="46" rx="8" fill="#fff7ed" stroke="#fb923c"/>
    <rect x="256" y="0" width="52" height="46" rx="8" fill="#fff7ed" stroke="#fdba74"/>
    <text x="26" y="28" text-anchor="middle" class="mono">head</text>
    <text x="107" y="20" text-anchor="middle" class="mono">Node</text>
    <text x="107" y="36" text-anchor="middle" class="tiny">user:1</text>
    <text x="201" y="20" text-anchor="middle" class="mono">Node</text>
    <text x="201" y="36" text-anchor="middle" class="tiny">user:2</text>
    <text x="282" y="28" text-anchor="middle" class="mono">tail</text>
    <path d="M52 18 H68 M68 31 H52 M146 18 H162 M162 31 H146 M240 18 H256 M256 31 H240" stroke="#ea580c" stroke-width="2"/>
  </g>

  <path d="M585 484 C585 516, 553 518, 553 548" class="lru-reference"/>
  <text x="520" y="518" class="tiny">lru_node</text>
  <path d="M570 548 C570 515, 650 515, 650 484" class="reference"/>
  <text x="660" y="518" class="tiny">Node.data</text>

  <text x="450" y="620" class="label">• GET/SET 성공: 해당 Node를 맨 앞으로 이동</text>
  <text x="450" y="643" class="label">• 메모리 초과: tail 앞의 back_node부터 제거</text>

  <!-- MinHeap panel -->
  <rect x="810" y="250" width="350" height="420" rx="18" class="panel" stroke="#7c3aed"/>
  <text x="835" y="283" class="section-title">3. MinHeap — TTL</text>

  <text x="835" y="317" class="small">배열로 저장하지만 완전 이진 트리처럼 인덱스를 계산</text>
  <g transform="translate(835 332)">
    <rect x="0" y="0" width="95" height="38" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <rect x="95" y="0" width="95" height="38" fill="#f5f3ff" stroke="#a78bfa"/>
    <rect x="190" y="0" width="95" height="38" fill="#f5f3ff" stroke="#a78bfa"/>
    <text x="47" y="24" text-anchor="middle" class="mono">record[0]</text>
    <text x="142" y="24" text-anchor="middle" class="mono">record[1]</text>
    <text x="237" y="24" text-anchor="middle" class="mono">record[2]</text>
  </g>

  <line x1="985" y1="370" x2="985" y2="397" stroke="#7c3aed" stroke-width="2"/>
  <line x1="985" y1="467" x2="900" y2="507" stroke="#7c3aed" stroke-width="2"/>
  <line x1="985" y1="467" x2="1070" y2="507" stroke="#7c3aed" stroke-width="2"/>

  <rect x="910" y="397" width="150" height="70" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="985" y="418" text-anchor="middle" class="box-title">가장 이른 만료</text>
  <text x="985" y="440" text-anchor="middle" class="mono">user:1 · 105s · v3</text>
  <text x="985" y="458" text-anchor="middle" class="tiny">peek() / pop()</text>

  <rect x="830" y="507" width="140" height="62" rx="10" fill="#f5f3ff" stroke="#a78bfa"/>
  <text x="900" y="532" text-anchor="middle" class="mono">cart · 130s · v1</text>
  <text x="900" y="552" text-anchor="middle" class="tiny">ExpiryRecord</text>

  <rect x="1000" y="507" width="140" height="62" rx="10" fill="#f5f3ff" stroke="#a78bfa"/>
  <text x="1070" y="532" text-anchor="middle" class="mono">token · 180s · v2</text>
  <text x="1070" y="552" text-anchor="middle" class="tiny">ExpiryRecord</text>

  <text x="835" y="603" class="label">• 부모의 expire_at ≤ 자식의 expire_at</text>
  <text x="835" y="625" class="label">• 재설정 전의 오래된 레코드는 힙에 남을 수 있음</text>
  <text x="835" y="647" class="label">• 현재 ttl_version과 다르면 무시(lazy deletion)</text>

  <!-- Expiry lookup path -->
  <path d="M985 670 V699 H215 V670" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
  <rect x="353" y="684" width="495" height="29" rx="14" fill="#f8fafc" stroke="#c4b5fd"/>
  <text x="600" y="703" text-anchor="middle" class="small">만료 시 record.key로 HashMap 재조회 → expire_at·ttl_version 일치 여부 확인</text>

  <!-- Operation summary -->
  <rect x="40" y="731" width="1120" height="209" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="65" y="765" class="section-title">명령별 핵심 동작</text>

  <rect x="65" y="789" width="250" height="122" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="85" y="817" class="box-title">SET</text>
  <text x="85" y="841" class="label">HashMap에 CacheEntry 저장</text>
  <text x="85" y="863" class="label">LRU Node를 front에 배치</text>
  <text x="85" y="885" class="label">used_memory 초과 시 back부터 삭제</text>

  <rect x="340" y="789" width="250" height="122" rx="12" fill="#fff7ed" stroke="#fdba74"/>
  <text x="360" y="817" class="box-title">GET</text>
  <text x="360" y="841" class="label">HashMap.get(key)로 평균 O(1) 조회</text>
  <text x="360" y="863" class="label">CacheEntry.lru_node로 바로 접근</text>
  <text x="360" y="885" class="label">move_to_front()로 최근 사용 갱신</text>

  <rect x="615" y="789" width="250" height="122" rx="12" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="635" y="817" class="box-title">EXPIRE / TTL</text>
  <text x="635" y="841" class="label">entry의 expire_at·version 갱신</text>
  <text x="635" y="863" class="label">ExpiryRecord를 MinHeap에 push</text>
  <text x="635" y="885" class="label">TTL 출력 때 나노초를 초로 변환</text>

  <rect x="890" y="789" width="245" height="122" rx="12" fill="#f0fdf4" stroke="#86efac"/>
  <text x="910" y="817" class="box-title">DEL / 만료 / LRU 제거</text>
  <text x="910" y="841" class="label">공통 _delete_entry() 사용</text>
  <text x="910" y="863" class="label">HashMap과 LRU에서 함께 제거</text>
  <text x="910" y="885" class="label">used_memory와 TTL 상태도 정리</text>

  <text x="600" y="963" text-anchor="middle" class="small">핵심: 세 자료구조는 역할이 다르지만 같은 키의 상태를 가리키므로 삽입·조회·삭제 때 함께 일관성을 유지해야 합니다.</text>
</svg>
